<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>同伴互评打分 · 文献阅读与写作</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  min-height:100vh;color:#1e1b2e;
  background:
    radial-gradient(1200px 600px at 8% -12%, rgba(124,58,237,.30), transparent 60%),
    radial-gradient(900px 520px at 100% -5%, rgba(219,39,119,.20), transparent 55%),
    linear-gradient(160deg,#171031 0%,#241a4d 55%,#1b1240 100%);
  background-attachment:fixed;
  padding:40px 20px 120px;
}
.wrap{max-width:1000px;margin:0 auto}
header{text-align:center;color:#fff;margin-bottom:26px}
h1{font-size:clamp(22px,3.6vw,32px);font-weight:800;letter-spacing:2px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
h1 .hl{background:linear-gradient(90deg,#fbbf24,#f59e0b,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.26);padding:20px 22px;margin-bottom:18px;color:#241a4d}
.card h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{font-size:14px;font-weight:800;color:#4c4270;margin-top:16px;margin-bottom:8px}
.hidden{display:none!important}
/* 首页入口 */
.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto}
.entry-btn{border:none;border-radius:16px;font:inherit;font-size:19px;font-weight:800;padding:26px 10px;cursor:pointer;transition:.15s;letter-spacing:2px}
.entry-btn.primary{color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);box-shadow:0 10px 30px rgba(124,58,237,.4)}
.entry-btn.primary:hover{transform:translateY(-2px)}
.entry-btn.dark{color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22)}
.entry-btn.dark:hover{background:rgba(255,255,255,.18)}
/* 按钮 */
.btn{cursor:pointer;border:none;border-radius:13px;font:inherit;font-weight:700;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{font-size:15px;padding:11px 26px;color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777)}
.btn.primary:disabled{opacity:.55;cursor:not-allowed}
.btn.primary:not(:disabled):hover{transform:translateY(-1px)}
.btn.lt{font-size:13.5px;padding:9px 16px;color:#5b4fa0;background:#f3efff;border:1px solid #e4ddff}
.btn.lt:hover{background:#e9e2ff}
.btn.lt.danger{color:#be123c;background:#ffe4e6;border-color:#fecdd3}
.btn.lt.danger:hover{background:#ffd6dd}
.btn.ghostdark{font-size:13px;padding:9px 14px;color:#cbbcf0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.btn.ghostdark:hover{background:rgba(255,255,255,.16)}
/* 视图头 */
.viewhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vtitle{color:#fff;font-weight:800;font-size:19px;letter-spacing:1px}
/* 学生端 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chip{padding:10px 4px;text-align:center;border-radius:11px;border:1.5px solid #e4ddff;background:#f7f5ff;font:inherit;font-weight:700;font-size:14.5px;color:#3b3160;cursor:pointer;position:relative;transition:.15s}
.chip:hover{background:#ece6ff;transform:translateY(-1px)}
.chip.done::after{content:"✓";position:absolute;top:-6px;right:-4px;background:#10b981;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.chip.me{border-color:#7c3aed;background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#4c1d95;box-shadow:0 0 0 3px rgba(124,58,237,.18)}
.me{font-size:14px;color:#7c3aed;font-weight:700}
.rrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid #efe9ff;background:#fdfcff;border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.rname{min-width:72px;font-weight:700;color:#241a4d;font-size:15px}
.pills{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.pill{width:34px;height:34px;border-radius:9px;border:1px solid #e4ddff;background:#f7f5ff;color:#4c4270;font:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.12s}
.pill:hover{background:#ece6ff;transform:translateY(-1px)}
.pill.sel{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(124,58,237,.35);transform:scale(1.06)}
/* 教师端 */
.progress .prow{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#4c4270}
.progress b{color:#4c1d95}
.pbar{height:10px;background:#efe9ff;border-radius:999px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#db2777);transition:width .4s}
details.card summary{cursor:pointer;font-size:17px;font-weight:800;color:#241a4d;list-style:none;display:flex;align-items:center;gap:6px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
.sumhead{display:flex;justify-content:flex-end;margin:0 0 8px}
table.sum{width:100%;border-collapse:collapse;font-size:13.5px}
.sum th{text-align:left;font-size:12px;color:#8a80a8;padding:6px 8px;border-bottom:2px solid #efe9ff}
.sum td{padding:7px 8px;border-bottom:1px solid #f3efff;color:#3b3160}
.sum td.nm{font-weight:700;color:#241a4d}
.sum td b{color:#4c1d95}
.mwrap{overflow:auto;max-height:65vh;border:1px solid #efe9ff;border-radius:12px;background:#fff}
table.matrix{border-collapse:separate;border-spacing:0;font-size:10.5px}
.matrix th,.matrix td{border-right:1px solid #f3efff;border-bottom:1px solid #f3efff;padding:3px 5px;text-align:center;min-width:30px}
.matrix thead th{position:sticky;top:0;background:#efe9ff;z-index:3;writing-mode:vertical-rl;height:74px;font-weight:700;color:#5b4fa0}
.matrix thead th:first-child{writing-mode:horizontal-tb;min-width:56px;z-index:4}
.matrix tbody th{position:sticky;left:0;background:#f7f5ff;font-weight:700;color:#5b4fa0;z-index:2;text-align:left;padding:3px 8px}
.matrix td{background:#fff}
.matrix td.self{background:#eae4fb;color:#c4b5fd}
.matrix td.na{background:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.tinput{width:100%;padding:10px 12px;border:1.5px solid #e4ddff;border-radius:11px;font:inherit;font-size:14px;outline:none;background:#fff;color:#241a4d}
.tinput:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.pw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
/* 底部操作条 */
.actionbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#241a4d;color:#fff;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 40px rgba(0,0,0,.45);z-index:60;max-width:94vw;flex-wrap:wrap;justify-content:center}
.actionbar span{font-size:14px;color:#e9d5ff;font-weight:700}
/* 登录弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,8,35,.66);display:flex;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(3px)}
.modalbox{background:#fff;border-radius:18px;padding:26px 26px 20px;width:min(92vw,360px);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modalbox h3{font-size:17px;color:#241a4d;margin-bottom:14px}
.modalbox .tinput{margin-bottom:8px}
.perr{color:#be123c;font-size:12.5px;margin-bottom:8px}
.mrow{display:flex;gap:10px;justify-content:flex-end}
/* 提示 */
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:#241a4d;color:#fff;font-size:14px;padding:11px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.18);opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .entry-grid{grid-template-columns:1fr}
  .pill{width:29px;height:29px;font-size:12px;border-radius:8px}
  .rname{min-width:64px;font-size:14px}
  .card{padding:16px 14px}
  .pw-grid{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;padding:0}
  .actionbar,.toast,.tools,.mwrap,.progress,.viewhead{display:none!important}
  .card{box-shadow:none;border:1px solid #bbb}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <div id="viewHome">
    <header><h1>同伴互评打分 <span class="hl">0–10</span></h1></header>
    <div class="entry-grid">
      <button type="button" class="entry-btn primary" id="studentEntry">学生评分</button>
      <button type="button" class="entry-btn dark" id="teacherEntry">教师端</button>
    </div>
  </div>

  <!-- 学生端 -->
  <div id="viewStudent" class="hidden">
    <div class="viewhead">
      <button type="button" class="btn ghostdark" id="studentHome">← 返回</button>
      <span class="vtitle">学生评分</span>
      <button type="button" class="btn ghostdark" id="stuLogoutBtn">退出</button>
    </div>
    <section class="card">
      <h2>选择你的名字</h2>
      <div class="chips" id="chips"></div>
    </section>
    <section class="card hidden" id="rateCard">
      <h2>打分 <span class="me" id="meTag"></span></h2>
      <div id="rows"></div>
    </section>
  </div>

  <!-- 教师端 -->
  <div id="viewTeacher" class="hidden">
    <div class="viewhead">
      <button type="button" class="btn ghostdark" id="teacherHome">← 返回</button>
      <span class="vtitle">教师端</span>
      <button type="button" class="btn ghostdark" id="logoutBtn">退出</button>
    </div>
    <section class="card progress">
      <div class="prow"><span>已提交</span><b id="progDone">0 / 28</b></div>
      <div class="pbar"><i id="progFill"></i></div>
    </section>
    <details class="card" open>
      <summary>汇总</summary>
      <div class="sumhead"><button type="button" class="btn lt" id="copySumBtn">复制</button></div>
      <table class="sum" id="sumTable"></table>
    </details>
    <details class="card">
      <summary>打分明细</summary>
      <div class="mwrap"><table class="matrix" id="matrixTable"></table></div>
    </details>
    <details class="card">
      <summary>工具</summary>
      <div class="tools">
        <button type="button" class="btn lt" id="exportBtn">导出 JSON</button>
        <button type="button" class="btn lt" id="importBtn">导入 JSON</button>
        <button type="button" class="btn lt" id="csvBtn">导出 CSV</button>
        <button type="button" class="btn lt danger" id="clearBtn">清空</button>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden"/>
      </div>
      <h4>教师密码</h4>
      <div class="pw-grid">
        <input type="password" class="tinput" id="np1" placeholder="新密码" autocomplete="new-password"/>
        <input type="password" class="tinput" id="np2" placeholder="确认密码" autocomplete="new-password"/>
      </div>
      <div class="tools"><button type="button" class="btn lt" id="passChangeBtn">保存</button></div>
      <h4>学生密码</h4>
      <div class="pw-grid">
        <input type="password" class="tinput" id="sp1" placeholder="新密码" autocomplete="new-password"/>
        <input type="password" class="tinput" id="sp2" placeholder="确认密码" autocomplete="new-password"/>
      </div>
      <div class="tools"><button type="button" class="btn lt" id="stuPassChangeBtn">保存</button></div>
    </details>
  </div>

</div>

<!-- 评分底部操作条 -->
<div class="actionbar hidden" id="actionbar">
  <span id="counter">已评 0 / 27</span>
  <button type="button" id="cancelBtn" class="btn ghostdark">取消</button>
  <button type="button" id="submitBtn" class="btn primary" disabled>提交</button>
</div>

<!-- 登录弹窗 -->
<div class="modal hidden" id="loginModal">
  <div class="modalbox">
    <h3 id="loginTitle">教师登录</h3>
    <input type="password" class="tinput" id="passInput" placeholder="密码" autocomplete="off"/>
    <p class="perr hidden" id="passErr">密码不正确</p>
    <div class="mrow">
      <button type="button" class="btn lt" id="passCancel">取消</button>
      <button type="button" class="btn primary" id="passOk">进入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* 教师密码仅以 SHA-256 哈希保存，可在教师端「工具」中修改 */
const STUDENTS = [
  "陈卓儒","董琼璘","李南稣",
  "李易阳","李卓帆","刘思远",
  "刘雨娴","王江辉","王林林",
  "谢博文","袁钰杰","张如梦",
  "周琛","陈香杏","贾超男",
  "焦琦珺","金子昊","李赓宸",
  "李明翰","刘飞龙","彭艳",
  "浦柏渠","叶乃波","于乘龙",
  "赵文静","周腾龙","陈怡冰",
  "刘海垚"
].map((name,i)=>({no:i+1,name:name}));

const KEY = "lrx_peer_scores_v1";
const PASS_KEY = "lrx_peer_scores_pass_v1";
const STU_PASS_KEY = "lrx_peer_scores_stu_pass_v1";
const SESSION_KEY = "lrx_teacher_session";
const SESSION_STU_KEY = "lrx_student_session";
const DEFAULT_HASH = "01d58c1ac3df6d023d869e50bf78e2f9185332c281f665fd53f6dbd7592df45e";
const DEFAULT_STUDENT_HASH = "b8e2b6b603da0e6f54883b6159bd27b2bc290e0739849bcfe9ed8694b42ea038";
const N = STUDENTS.length;
const TOTAL_RATEES = N - 1;
const $ = id => document.getElementById(id);

let raters = {};
let me = null;
let draft = {};

function stamp() { const t = new Date(); const p = n => String(n).padStart(2, "0"); return "" + t.getFullYear() + p(t.getMonth() + 1) + p(t.getDate()) + "_" + p(t.getHours()) + p(t.getMinutes()); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
function nameOf(no) { const s = STUDENTS[no - 1]; return s ? s.name : "?"; }

/* 视图 */
function showView(v) {
  ["viewHome", "viewStudent", "viewTeacher"].forEach(id => $(id).classList.add("hidden"));
  $(v).classList.remove("hidden");
  $("actionbar").classList.add("hidden");
  window.scrollTo({ top: 0 });
}

/* 存储 */
function sanitizeAll(d) {
  const out = {};
  if (!d || typeof d !== "object") return out;
  for (const k of Object.keys(d)) {
    const no = parseInt(k, 10);
    const e = d[k];
    if (!(no >= 1 && no <= N)) continue;
    if (!e || typeof e !== "object" || !e.s || typeof e.s !== "object") continue;
    const s = {};
    for (const rk of Object.keys(e.s)) {
      const rn = parseInt(rk, 10);
      const v = e.s[rk];
      if (rn >= 1 && rn <= N && rn !== no && Number.isInteger(v) && v >= 0 && v <= 10) s[rn] = v;
    }
    if (Object.keys(s).length) out[no] = { t: (typeof e.t === "string" ? e.t : new Date().toISOString()), s };
  }
  return out;
}
function loadStore() {
  try { raters = sanitizeAll(JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch(e) { raters = {}; }
}
function saveStore() {
  try { localStorage.setItem(KEY, JSON.stringify(raters)); return true; }
  catch(e) { return false; }
}

/* 学生端 */
function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  STUDENTS.forEach(s => {
    const c = document.createElement("button");
    c.type = "button";
    c.className = "chip" + (raters[s.no] ? " done" : "") + (me === s.no ? " me" : "");
    c.textContent = s.name;
    c.addEventListener("click", () => selectMe(s.no));
    box.appendChild(c);
  });
}

function selectMe(no) {
  me = no;
  draft = raters[no] ? Object.assign({}, raters[no].s) : {};
  $("rateCard").classList.remove("hidden");
  $("meTag").textContent = "（我是：" + nameOf(no) + "）";
  $("actionbar").classList.remove("hidden");
  renderChips();
  buildRows();
  updateCounter();
  $("rateCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

function buildRows() {
  const box = $("rows");
  box.innerHTML = "";
  STUDENTS.forEach(s => {
    if (s.no === me) return;
    const row = document.createElement("div");
    row.className = "rrow";
    const nm = document.createElement("span");
    nm.className = "rname";
    nm.textContent = s.name;
    const pills = document.createElement("div");
    pills.className = "pills";
    for (let v = 0; v <= 10; v++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill" + (draft[s.no] === v ? " sel" : "");
      b.textContent = v;
      b.addEventListener("click", () => {
        draft[s.no] = v;
        pills.querySelectorAll(".pill").forEach(p => p.classList.toggle("sel", +p.textContent === v));
        updateCounter();
      });
      pills.appendChild(b);
    }
    row.appendChild(nm);
    row.appendChild(pills);
    box.appendChild(row);
  });
}

/* 允许部分提交：提交时至少评 1 人即可 */
function updateCounter() {
  const done = Object.keys(draft).length;
  $("counter").textContent = "已评 " + done + " / " + TOTAL_RATEES;
  $("submitBtn").disabled = done === 0;
}

/* 重复提交直接覆盖，仅保留最后一次 */
function submitMine() {
  if (me === null) return;
  if (Object.keys(draft).length === 0) return;
  raters[me] = { t: new Date().toISOString(), s: draft };
  const ok = saveStore();
  me = null; draft = {};
  $("rateCard").classList.add("hidden");
  $("actionbar").classList.add("hidden");
  renderChips();
  window.scrollTo({ top: 0 });
  toast(ok ? "已提交" : "保存失败");
}

function cancelMine() {
  me = null; draft = {};
  $("rateCard").classList.add("hidden");
  $("actionbar").classList.add("hidden");
  renderChips();
}

function resetStudentView() {
  me = null; draft = {};
  $("rateCard").classList.add("hidden");
  $("actionbar").classList.add("hidden");
  renderChips();
}

/* 教师端 */
function renderProgress() {
  const done = Object.keys(raters).length;
  $("progDone").textContent = done + " / " + N;
  $("progFill").style.width = (done / N * 100) + "%";
}

function receivedStats() {
  const stats = STUDENTS.map(s => ({ no: s.no, name: s.name, sum: 0, scores: [] }));
  for (const k of Object.keys(raters)) {
    const e = raters[k];
    for (const rk of Object.keys(e.s)) {
      const rn = +rk;
      if (stats[rn - 1]) { stats[rn - 1].sum += e.s[rk]; stats[rn - 1].scores.push(e.s[rk]); }
    }
  }
  return stats;
}
function avgOf(st) { return st.scores.length ? st.sum / st.scores.length : null; }
function avg1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
function sortedStats() {
  return receivedStats().slice().sort((a, b) => {
    const aa = avgOf(a), bb = avgOf(b);
    if (aa === null && bb === null) return a.no - b.no;
    if (aa === null) return 1;
    if (bb === null) return -1;
    if (bb !== aa) return bb - aa;
    return b.scores.length - a.scores.length || a.no - b.no;
  });
}

function renderSummary() {
  const stats = sortedStats();
  let html = "<tr><th>名次</th><th>姓名</th><th>平均分</th><th>评分数</th></tr>";
  stats.forEach((st, i) => {
    const avg = avgOf(st);
    html += "<tr><td>" + (i + 1) + "</td><td class=\"nm\">" + st.name + "</td><td><b>" +
      (avg === null ? "—" : avg1(avg)) + "</b></td><td>" + st.scores.length + "</td></tr>";
  });
  $("sumTable").innerHTML = html;
}

function renderMatrix() {
  let html = "<thead><tr><th></th>";
  STUDENTS.forEach(c => { html += "<th>" + c.name + "</th>"; });
  html += "</tr></thead><tbody>";
  STUDENTS.forEach(r => {
    const e = raters[r.no];
    html += "<tr><th>" + r.name + "</th>";
    STUDENTS.forEach(c => {
      if (c.no === r.no) { html += "<td class=\"self\">—</td>"; return; }
      const v = e ? e.s[c.no] : undefined;
      if (v === undefined) html += "<td class=\"na\"></td>";
      else html += "<td style=\"background:rgba(109,40,217," + (0.06 + v * 0.088).toFixed(3) +
        ");color:" + (v >= 6 ? "#fff" : "#3b3160") + "\">" + v + "</td>";
    });
    html += "</tr>";
  });
  html += "</tbody>";
  $("matrixTable").innerHTML = html;
}

function renderTeacher() { renderProgress(); renderSummary(); renderMatrix(); }
function enterTeacher() { renderTeacher(); showView("viewTeacher"); }

function copySummary() {
  const stats = sortedStats();
  const lines = ["同伴互评汇总"];
  stats.forEach((st, i) => {
    const avg = avgOf(st);
    lines.push((i + 1) + ". " + st.name + " " + (avg === null ? "—" : avg1(avg)) + "（" + st.scores.length + "）");
  });
  copyTextPlain(lines.join("\n"), "已复制");
}

/* 登录（教师 / 学生共用弹窗，仅存哈希） */
let loginMode = "teacher";
async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function getPassHash() {
  try { const h = localStorage.getItem(PASS_KEY); if (h) return h; } catch(e) {}
  return DEFAULT_HASH;
}
function getStuPassHash() {
  try { const h = localStorage.getItem(STU_PASS_KEY); if (h) return h; } catch(e) {}
  return DEFAULT_STUDENT_HASH;
}
function openLogin(mode) {
  loginMode = mode || "teacher";
  $("loginTitle").textContent = loginMode === "student" ? "学生登录" : "教师登录";
  $("passInput").value = "";
  $("passErr").classList.add("hidden");
  $("loginModal").classList.remove("hidden");
  setTimeout(() => $("passInput").focus(), 60);
}
function closeLogin() { $("loginModal").classList.add("hidden"); }
async function tryLogin() {
  const v = $("passInput").value;
  if (!v) return;
  let h;
  try { h = await sha256(v); }
  catch(e) { toast("此浏览器不支持"); return; }
  const target = loginMode === "student" ? getStuPassHash() : getPassHash();
  if (h === target) {
    try { sessionStorage.setItem(loginMode === "student" ? SESSION_STU_KEY : SESSION_KEY, "1"); } catch(e) {}
    closeLogin();
    if (loginMode === "student") enterStudent(); else enterTeacher();
  } else {
    $("passErr").classList.remove("hidden");
  }
}
function enterStudent() { resetStudentView(); showView("viewStudent"); }
async function changePass() {
  const p = $("np1").value, p2 = $("np2").value;
  if (p.length < 4) { toast("至少 4 位"); return; }
  if (p !== p2) { toast("两次输入不一致"); return; }
  try {
    localStorage.setItem(PASS_KEY, await sha256(p));
    $("np1").value = ""; $("np2").value = "";
    toast("已修改");
  } catch(e) { toast("保存失败"); }
}
async function changeStuPass() {
  const p = $("sp1").value, p2 = $("sp2").value;
  if (p.length < 4) { toast("至少 4 位"); return; }
  if (p !== p2) { toast("两次输入不一致"); return; }
  try {
    localStorage.setItem(STU_PASS_KEY, await sha256(p));
    $("sp1").value = ""; $("sp2").value = "";
    toast("已修改");
  } catch(e) { toast("保存失败"); }
}

/* 剪贴板 / 下载 */
function copyTextPlain(text, okMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast(okMsg), () => fallbackCopy(text, okMsg));
  } else fallbackCopy(text, okMsg);
}
function fallbackCopy(text, okMsg) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
  toast(ok ? okMsg : "复制失败");
}
function download(name, text, mime) {
  try {
    const blob = new Blob([text], { type: mime || "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
  } catch(e) { toast("导出失败"); }
}

/* 导出 / 导入 / 清空 */
function exportJSON() {
  download("peer_scores_" + stamp() + ".json", JSON.stringify({ ratings: raters }, null, 2));
  toast("已导出");
}
function exportCSV() {
  const rows = [];
  rows.push(["评分人"].concat(STUDENTS.map(s => s.name)).join(","));
  STUDENTS.forEach(r => {
    const e = raters[r.no];
    const cells = [r.name];
    STUDENTS.forEach(c => {
      if (c.no === r.no) cells.push("—");
      else cells.push(e && e.s[c.no] !== undefined ? e.s[c.no] : "");
    });
    rows.push(cells.join(","));
  });
  download("peer_scores_" + stamp() + ".csv", "\uFEFF" + rows.join("\r\n"), "text/csv;charset=utf-8");
  toast("已导出");
}
function importFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const inc = sanitizeAll(d && d.ratings ? d.ratings : d);
      for (const k of Object.keys(inc)) {
        const no = +k;
        if (!raters[no] || inc[k].t > raters[no].t) raters[no] = inc[k];
      }
      saveStore();
      renderTeacher();
      renderChips();
      toast("导入成功");
    } catch(e) { toast("导入失败"); }
  };
  r.readAsText(f, "utf-8");
}
